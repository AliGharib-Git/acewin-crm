name: acewin-crm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acewin_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-acewin_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Unset POSTGRES_HOST_PORT in .env to keep Postgres unreachable from
      # the host entirely; backend<->db traffic never leaves this network.
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acewin_app} -d ${POSTGRES_DB:-acewin_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [acewin]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-acewin_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-acewin_crm}
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env -- generate one with the snippet in .env.example}"
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@acewin.ir}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
    volumes:
      # Drop the Olist CSVs into ./backend/data/olist/ on the host; the
      # Analytics Engine's feature cache (./backend/data/_cache/) then
      # survives container restarts/rebuilds too.
      - ./backend/data:/app/data
    ports:
      # Production: bind only to loopback. The host Nginx reverse proxy is
      # the sole public entry point; Docker must not publish the API itself.
      - "${BACKEND_HOST_BIND:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [acewin]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Production: bind only to loopback. Host Nginx terminates TLS and
      # proxies traffic here.
      - "${FRONTEND_HOST_BIND:-127.0.0.1}:${FRONTEND_HOST_PORT:-8080}:80"
    networks: [acewin]

  # One-off seeding, e.g.:
  #   docker compose --profile tools run --rm seed
  # (swap seed.py for seed_demo.py in `command` for the presentation-ready
  # demo dataset instead — see backend/seed_demo.py's own docstring).
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-acewin_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-acewin_crm}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    entrypoint: ["python", "seed.py"]
    networks: [acewin]

networks:
  acewin:

volumes:
  pgdata:
