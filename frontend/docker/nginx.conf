server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Static assets built by Vite are content-hashed (e.g. index-Ab12Cd.js),
    # so they're safe to cache aggressively and immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy every /api/* call to the backend service. Keeps the
    # frontend and backend on a single origin from the browser's point of
    # view, so no CORS_ORIGINS juggling is needed for a same-host deploy.
    # "backend" is the docker-compose service name / hostname, resolved via
    # Docker's internal DNS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # SPA fallback: any non-file, non-/api route is handled client-side by
    # react-router, so always fall back to index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell itself, or a new deploy can be masked by a
    # stale cached index.html referencing assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
