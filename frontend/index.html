<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACEWIN</title>
    <meta name="description" content="ACEWIN — a general-purpose, customizable CRM for contacts, pipeline, tasks and reporting." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Persian (fa) glyph coverage: Newsreader / IBM Plex Sans have no Arabic/Persian
      glyphs, so RTL text was silently falling back to whatever the OS default is —
      which renders inconsistently on Apple Safari (macOS/iOS) in particular. Vazirmatn
      is shipped here as static per-weight woff2 files (no variable-font axis, no
      unicode-range subsetting), which is the safest format for Safari's font engine.
    -->
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
